spring.application.name=ecommers-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ecomdb
spring.datasource.username=pranavDB
spring.datasource.password=embarkx
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console (Not required for PostgreSQL)
# spring.h2.console.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always